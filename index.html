<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Token Quest — hecho con IA</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: #0e0f1a;
        font-family: system-ui, "Segoe UI", sans-serif; color: #e8e9f3;
        overflow: hidden;
      }
      #app {
        display: flex; align-items: center; justify-content: center;
        width: 100vw; height: 100vh;
      }
      canvas { image-rendering: pixelated; border-radius: 10px; box-shadow: 0 12px 48px rgba(0,0,0,.55); }

      /* Reveal card overlay ("How AI made this" / weapon = LLM) */
      #card-layer {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(6,7,16,.72); backdrop-filter: blur(4px); z-index: 20; padding: 20px;
      }
      #card-layer.show { display: flex; }
      .card {
        max-width: 460px; width: 100%; background: linear-gradient(160deg, #1b1e33, #14162a);
        border: 1px solid #33385f; border-radius: 16px; padding: 22px 24px;
        box-shadow: 0 18px 60px rgba(0,0,0,.6); animation: pop .18s ease-out;
      }
      @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .card .tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #8ff0d4; }
      .card h2 { margin: 6px 0 12px; font-size: 20px; }
      .card p { margin: 8px 0; line-height: 1.5; font-size: 14px; color: #c7c9e0; }
      .card .prompt {
        font-family: ui-monospace, "Cascadia Code", monospace; font-size: 12.5px; color: #d7f7ec;
        background: #0d1b1a; border: 1px solid #1f3d38; border-radius: 10px; padding: 10px 12px; white-space: pre-wrap;
      }
      .card .meta { display: flex; gap: 16px; margin-top: 12px; font-size: 12.5px; color: #9aa0c9; flex-wrap: wrap; }
      .card .meta b { color: #e8e9f3; }
      .card button {
        margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 10px; cursor: pointer;
        background: #6a5cff; color: #fff; font-size: 14px; font-weight: 600;
      }
      .card button:hover { background: #7d70ff; }

      /* Full-screen overlays (title / result / leaderboard) drawn over the canvas art */
      #screen-layer {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(6,7,16,.42); z-index: 15; padding: 20px;
      }
      #screen-layer.show { display: flex; }
      .screen {
        position: relative; max-width: 540px; width: 100%; text-align: center;
        background: linear-gradient(160deg, rgba(27,30,51,.94), rgba(18,20,38,.96));
        border: 1px solid #33385f; border-radius: 18px; padding: 26px 26px 24px;
        box-shadow: 0 22px 70px rgba(0,0,0,.65); animation: pop .2s ease-out;
      }
      .screen.wide { max-width: 620px; }
      .screen .tag { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #8ff0d4; }
      .screen .brand {
        margin: 6px 0 2px; font-size: 46px; font-weight: 800; letter-spacing: .01em;
        background: linear-gradient(120deg, #7cffd4, #7d70ff 60%, #ff8cf0);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .screen h2 { margin: 4px 0 10px; font-size: 24px; }
      .screen .tagline { margin: 0 auto 18px; max-width: 420px; line-height: 1.5; font-size: 14.5px; color: #c7c9e0; }
      .screen p { line-height: 1.5; font-size: 14px; color: #c7c9e0; }
      .screen input {
        width: 100%; padding: 12px 14px; margin: 4px 0 14px; font-size: 15px;
        background: #0e1120; border: 1px solid #33385f; border-radius: 10px; color: #e8e9f3; text-align: center;
      }
      .screen input:focus { outline: none; border-color: #6a5cff; }
      .field-label { display: block; text-align: left; font-size: 12px; color: #9aa0c9; margin-bottom: 2px; letter-spacing: .04em; }
      .btnrow { display: flex; gap: 10px; margin-top: 6px; }
      .screen button {
        flex: 1; padding: 12px; border: 0; border-radius: 10px; cursor: pointer; font-size: 14.5px; font-weight: 700;
      }
      button.primary { background: #6a5cff; color: #fff; }
      button.primary:hover { background: #7d70ff; }
      button.ghost { background: #232640; color: #cfd2ee; border: 1px solid #3a3f66 !important; }
      button.ghost:hover { background: #2c3050; }
      .topbar { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
      .topbar button { flex: none; padding: 7px 11px; font-size: 12px; font-weight: 600; background: #232640; color: #cfd2ee; }
      .topbar button:hover { background: #2c3050; }
      .bignum { font-size: 52px; font-weight: 800; color: #ffd65a; margin: 6px 0; }
      .bignum .lbl { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9aa0c9; font-weight: 600; }
      .usage { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 4px; font-size: 13px; color: #c7c9e0; }
      .usage span b { color: #fff; }
      .status { min-height: 18px; font-size: 12.5px; margin: 8px 0 2px; }
      .status.ok { color: #7cffd4; } .status.fail { color: #ff9db0; }
      .lb { margin: 8px 0 4px; max-height: 320px; overflow-y: auto; }
      .lb-row {
        display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 8px;
        padding: 9px 12px; border-radius: 9px; font-size: 14px;
      }
      .lb-row + .lb-row { margin-top: 4px; }
      .lb-row.head { color: #9aa0c9; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 12px; }
      .lb-row.odd { background: rgba(255,255,255,.03); }
      .lb-row.you { background: rgba(106,92,255,.22); border: 1px solid #6a5cff; }
      .lb-row .rank { color: #8ff0d4; font-weight: 700; text-align: center; }
      .lb-row .name { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lb-row .tok { color: #ffd65a; font-weight: 700; }
      .foot-note { margin-top: 14px; font-size: 12px; color: #8b90b8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="screen-layer"><div id="screen-host"></div></div>
    <div id="card-layer"><div id="card-host"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
